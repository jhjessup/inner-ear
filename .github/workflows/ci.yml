name: CI

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (InnerEar)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Select the newest Xcode installed on the runner instead of pinning a
      # specific version — Package.swift requires swift-tools-version 6.0+
      # (for the Testing module), and a hardcoded older Xcode (e.g. 15.4,
      # which ships Swift 5.10) will fail with a tools-version mismatch as
      # soon as it falls behind. Runner images update their Xcode set over
      # time, so pick whatever's actually there.
      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Swift version
        run: swift --version

      - name: Cache SPM build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # `swift test` builds first, so a separate `swift build` step would
      # just pay for the same compile twice.
      - name: Test
        run: swift test --package-path . -v
