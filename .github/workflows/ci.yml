name: CI

on:
  push:
    branches: [master, "mission/**"]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & Test (InnerEar)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --package-path . -v

      - name: Test
        run: swift test --package-path . -v
